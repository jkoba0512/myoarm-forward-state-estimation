[project]
name = "myoarm-forward-state-estimation"
version = "0.1.0"
description = "Predictive state observation and adaptive correction-gain experiments for MyoSuite myoArm reaching."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Jun Kobayashi", email = "kobayashi.jun184@m.kyutech.ac.jp" },
]
keywords = [
  "forward-model",
  "state-estimation",
  "sensorimotor-delay",
  "myosuite",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "gymnasium>=1.2.0",
  "myosuite>=2.12.1",
  "numpy>=2.0",
  "scipy>=1.13",
  "torch>=2.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myoarm_fse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "myosuite: tests that require MyoSuite + MuJoCo (opt-in via -m myosuite)",
]
addopts = "-m 'not myosuite'"
