[project]
name = "myoarm-forward-state-estimation"
version = "0.1.0"
description = "Forward model and Kalman-like state estimation experiments for MyoSuite myoArm reaching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.2.0",
  "myosuite>=2.12.1",
  "numpy>=2.0",
  "scipy>=1.13",
  "torch>=2.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myoarm_fse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "myosuite: tests that require MyoSuite + MuJoCo (opt-in via -m myosuite)",
]
addopts = "-m 'not myosuite'"
