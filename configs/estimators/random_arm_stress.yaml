# Phase 3.2-style stress eval on the ReachRandom transfer test.
# Forward model is provided via --forward-model CLI override
# (one of the three ReachRandom-trained H=1/4/8 models).
#
# Grid: 3 controllers × 6 noise × 4 delays × 5 K = 360 cells
#
# Run examples:
#   uv run python scripts/evaluate_estimator.py \
#       --config configs/estimators/random_arm_stress.yaml \
#       --forward-model runs/models/<H1_id>
#   (and similarly for H=4, H=8 model_ids)

seed: 0
forward_model: runs/models/PLACEHOLDER

runs:
  - runs/episodes/2026-05-12T12-50-01Z   # random, sigma=0.2  (50 eps)
  - runs/episodes/2026-05-12T12-50-13Z   # lowamp, sigma=0.05 (50 eps)
  - runs/episodes/2026-05-12T12-50-24Z   # hold              (6  eps)

obs_compose: noisy_then_delayed

gain_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
delay_grid: [0, 6, 18, 36]

noise_conditions:
  none:
    qpos: 0.0
    qvel: 0.0
    tip_pos: 0.0
    reach_err: 0.0
  low:
    qpos: 0.005
    qvel: 0.005
    tip_pos: 0.0025
    reach_err: 0.0025
  medium:
    qpos: 0.01
    qvel: 0.01
    tip_pos: 0.005
    reach_err: 0.005
  high:
    qpos: 0.02
    qvel: 0.02
    tip_pos: 0.01
    reach_err: 0.01
  vhigh:
    qpos: 0.04
    qvel: 0.04
    tip_pos: 0.02
    reach_err: 0.02
  xhigh:
    qpos: 0.08
    qvel: 0.08
    tip_pos: 0.04
    reach_err: 0.04

skip_cold_start: true
output_root: runs/estimators
