# Phase 3.2 stress eval: extends Phase 3.3-min with larger delays and
# higher noise to find the regime where blending gain (K < 1) again
# beats observation-only (K = 1).
#
# Grid: 3 controllers x 6 noise x 4 delays x 5 K = 360 cells
# (Phase 3.3-min was 144). Expected wall time ~30 min.
#
# Run with:
#   uv run python scripts/evaluate_estimator.py \
#       --config configs/estimators/fixed_kalman_stress.yaml

seed: 0
forward_model: runs/models/2026-05-10T07-25-23Z

runs:
  - runs/episodes/2026-05-09T23-51-12Z   # random
  - runs/episodes/2026-05-10T02-37-37Z   # lowamp
  - runs/episodes/2026-05-10T02-38-00Z   # hold

obs_compose: noisy_then_delayed

gain_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
delay_grid: [0, 6, 18, 36]

# Six conditions: original four + vhigh (x4 of medium = x2 of high) +
# xhigh (x8 of medium = x4 of high). Sigma keys match
# NoisyObservationWrapper field names.
noise_conditions:
  none:
    qpos: 0.0
    qvel: 0.0
    tip_pos: 0.0
    reach_err: 0.0
  low:
    qpos: 0.005
    qvel: 0.005
    tip_pos: 0.0025
    reach_err: 0.0025
  medium:
    qpos: 0.01
    qvel: 0.01
    tip_pos: 0.005
    reach_err: 0.005
  high:
    qpos: 0.02
    qvel: 0.02
    tip_pos: 0.01
    reach_err: 0.01
  vhigh:
    qpos: 0.04
    qvel: 0.04
    tip_pos: 0.02
    reach_err: 0.02
  xhigh:
    qpos: 0.08
    qvel: 0.08
    tip_pos: 0.04
    reach_err: 0.04

skip_cold_start: true
output_root: runs/estimators
