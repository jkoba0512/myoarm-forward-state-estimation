# Single-step (H=1) residual MLP for the ReachRandom transfer test.
# Same architecture / hyperparams as mlp_expanded.yaml but trained on
# the ReachRandom 106-episode dataset (49,740 transitions).

seed: 0

architecture:
  hidden_dims: [256, 256]

train:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 256
  epochs: 200
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0
  val_step: 5

data:
  dataset_paths:
    - runs/datasets/random_arm_expanded.npz

eval:
  rollout_horizons: [1, 10, 50]

output:
  output_root: runs/models
