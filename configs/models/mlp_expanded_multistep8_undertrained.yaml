# Undertrained H=8 forward-model: same architecture and data as the
# main H=8 model (configs/models/mlp_expanded_multistep8.yaml) but
# stopped early at 30% of full training (60 epochs vs 200).
#
# Used by RQ2 to test how forward-model quality affects the K*_cl
# distribution and the predictive value of fm-error/bias for
# Delta-outcome.

seed: 0

architecture:
  hidden_dims: [256, 256]

train:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 256
  epochs: 60                    # 30% of the main H=8 200 epochs
  early_stopping_patience: 999  # disable early-stopping; we want degraded
  early_stopping_min_delta: 0.0
  val_step: 5
  multi_step: 8

data:
  dataset_paths:
    - runs/datasets/expanded.npz

eval:
  rollout_horizons: [1, 10, 50]

output:
  output_root: runs/models
