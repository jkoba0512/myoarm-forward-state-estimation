# Phase B forward-model training: same expanded dataset (51k transitions
# across 106 episodes) as mlp_expanded.yaml, but with multi-step rollout
# supervision (K=4) instead of single-step Δx loss.
#
# Motivation: Phase 3.2 stress eval showed that for delay >= 6 the
# oracle Kalman gain is uniformly 1.0 — the forward-model rollout error
# compounds faster than observation noise grows, so blending never
# beats raw observation. A K-step rollout loss directly penalises
# multi-step error and should widen the regime where learned gain
# beats K=1.0 in closed loop.
#
# Run with:
#   uv run python scripts/train_forward_model.py \
#       --config configs/models/mlp_expanded_multistep4.yaml

seed: 0

architecture:
  hidden_dims: [256, 256]

train:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 256
  epochs: 200
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0
  val_step: 5
  multi_step: 4

data:
  dataset_paths:
    - runs/datasets/expanded.npz

eval:
  rollout_horizons: [1, 10, 50]

output:
  output_root: runs/models
