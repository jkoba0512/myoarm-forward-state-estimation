# R3 undertrained H=8 residual MLP on the reachable-target dataset.
#
# Used by RQ2 / C3 as the degraded forward-model quality point in the
# H=1 / H=4 / H=8 / undertrained-H=8 ordering. Identical to
# mlp_expanded_multistep8_undertrained.yaml (early stop at 60 epochs =
# 30% of full training) except for the swapped data path (see
# mlp_reachable_h1.yaml header for provenance).

seed: 0

architecture:
  hidden_dims: [256, 256]

train:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 256
  epochs: 60                    # 30% of the main R3 H=8 200 epochs
  early_stopping_patience: 999  # disable early-stopping; we want degraded
  early_stopping_min_delta: 0.0
  val_step: 5
  multi_step: 8

data:
  dataset_paths:
    - runs/datasets/expanded_reachable.npz

eval:
  rollout_horizons: [1, 10, 50]

output:
  output_root: runs/models
