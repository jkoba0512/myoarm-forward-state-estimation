# R3 C2 single-cell SPSA β training.
#
# Trains β on the single (none, d=18) cell under the R3 H=8 forward
# model (multistep-8, trained on the reachable_train target set) and
# the joint-PD controller. SPSA budget unified with C3 fullgrid at
# 100 iter / 12 samples per side per Codex Stage B decision Q5
# (2026-05-21) -- old poc was 60 iter / 5 samples.
#
# Mirrors reliability_adaptive_v2_poc.yaml except for the swapped
# forward_model, target_set, and SPSA hyperparams (max_iter,
# samples_per_side).

seed: 0

env_id: myoArmReachFixed-v0
horizon: 600
max_steps: 600
forward_model: runs/models/2026-05-21T09-46-39Z
target_set: runs/targets_reachable/2026-05-21T09-13-52Z/reachable_train.npz

noise_conditions:
  none: { qpos: 0.0, qvel: 0.0, tip_pos: 0.0, reach_err: 0.0 }

delay_grid: [18]

controller:
  name: joint_pd
  Kp: 30.0
  Kd: 3.0
  action_scale: 5.0
  ik_max_iter: 200
  ik_tol: 0.01
  ik_damping: 0.1

observer:
  alpha: 0.05
  epsilon: 1.0e-6
  var_init: 1.0
  init_beta0:
    qpos: 0.0
    qvel: 0.0
    act: 0.0
    tip_pos: 0.0
    reach_err: 0.0
  init_beta1:
    qpos: 0.5
    qvel: 0.5
    act: 0.5
    tip_pos: 0.5
    reach_err: 0.5
  target_pos_gain: 1.0

spsa:
  max_iter: 100
  samples_per_side: 12
  a: 2.0
  c: 0.3
  alpha: 0.602
  gamma: 0.101
  A: 5.0

output_root: runs/reliability_adaptive_v2
