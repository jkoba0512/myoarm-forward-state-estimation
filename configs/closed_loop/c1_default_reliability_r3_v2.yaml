# Stage C C1: default reliability deploy.
#
# Deploys the default ReliabilityAdaptiveObserver (β0=0, β1=0.5 across
# all fields) on the R3 stabilized below-shoulder reach task.
# Provides the C1 baseline in the new paper narrative
# (Codex 2026-06-01 paper-narrative-update response).

seed: 0

env_id: myoArmReachFixed-v0
horizon: 600

forward_model: runs/models/2026-05-21T09-46-39Z
target_set: runs/targets_reachable/2026-05-27T07-37-54Z/reachable_train.npz
episodes_per_cell: 200

obs_compose: noisy_then_delayed

noise_conditions:
  none:  { qpos: 0.0,  qvel: 0.0,  tip_pos: 0.0,  reach_err: 0.0 }
  high:  { qpos: 0.02, qvel: 0.02, tip_pos: 0.01, reach_err: 0.01 }
  xhigh: { qpos: 0.08, qvel: 0.08, tip_pos: 0.04, reach_err: 0.04 }

delay_grid: [0, 18]

estimators:
  - name: default_reliability
    kind: reliability_adaptive
    config:
      alpha: 0.05
      epsilon: 1.0e-6
      var_init: 1.0
      beta0: { qpos: 0.0, qvel: 0.0, act: 0.0, tip_pos: 0.0, reach_err: 0.0 }
      beta1: { qpos: 0.5, qvel: 0.5, act: 0.5, tip_pos: 0.5, reach_err: 0.5 }
      target_pos_gain: 1.0

controller:
  name: stabilized_endpoint
  Kp: 30.0
  Kd: 3.0
  action_scale: 5.0
  T_ramp: 300
  record_history: true

sdn:
  sigma: 0.0

success_thresholds: [0.05, 0.10, 0.15]
success_duration: 10
skip_cold_start_steps_use_delay: true
save_per_episode: true

output_root: runs/closed_loop
