# Endpoint-error feedback controller closed-loop eval, mirroring
# joint_pd_mvp_phaseC.yaml (H=8 forward model, ReachFixed env).
# Three estimators: K=0, K=1, Stage A retrained on closed-loop oracle.
# Used to add a third controller-coupling axis to F6 / Discussion.

seed: 0

env_id: myoArmReachFixed-v0
horizon: 600

forward_model: runs/models/2026-05-11T11-47-34Z

target_set: runs/targets/train.npz
episodes_per_cell: 10

obs_compose: noisy_then_delayed

noise_conditions:
  none:    { qpos: 0.0,   qvel: 0.0,   tip_pos: 0.0,    reach_err: 0.0 }
  high:    { qpos: 0.02,  qvel: 0.02,  tip_pos: 0.01,   reach_err: 0.01 }
  xhigh:   { qpos: 0.08,  qvel: 0.08,  tip_pos: 0.04,   reach_err: 0.04 }

delay_grid: [0, 18]

estimators:
  - name: K=0.0
    kind: fixed
    gain: 0.0
  - name: K=1.0
    kind: fixed
    gain: 1.0
  - name: learned_phaseC_closed_loop_oracle
    kind: learned
    learned_gain_model: runs/learned_gain_models/2026-05-11T14-04-04Z

controller:
  name: endpoint_feedback
  Kp: 30.0
  Kd: 3.0
  action_scale: 5.0

sdn:
  sigma: 0.0

success_thresholds: [0.05, 0.10, 0.15]
success_duration: 10
skip_cold_start_steps_use_delay: true
save_per_episode: true

output_root: runs/closed_loop
