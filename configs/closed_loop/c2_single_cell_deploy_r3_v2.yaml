# Stage C C2: single-cell SPSA β deploy on (none, d=18) only.
#
# Deploys the B.2-trained single-cell β (none, d=18) on the same
# (none, d=18) cell, 200 ep. Uses beta_source path so the deployed
# values are traceable to the training run (Codex 2026-06-01 Q27).

seed: 0

env_id: myoArmReachFixed-v0
horizon: 600

forward_model: runs/models/2026-05-21T09-46-39Z
target_set: runs/targets_reachable/2026-05-27T07-37-54Z/reachable_train.npz
episodes_per_cell: 200

obs_compose: noisy_then_delayed

noise_conditions:
  none: { qpos: 0.0, qvel: 0.0, tip_pos: 0.0, reach_err: 0.0 }

delay_grid: [18]

estimators:
  - name: c2_single_cell_beta
    kind: reliability_adaptive
    beta_source: runs/reliability_adaptive_v2/2026-05-28T08-11-37Z/final_beta.json
    config:
      alpha: 0.05
      epsilon: 1.0e-6
      var_init: 1.0
      target_pos_gain: 1.0

controller:
  name: stabilized_endpoint
  Kp: 30.0
  Kd: 3.0
  action_scale: 5.0
  T_ramp: 300
  record_history: true

sdn:
  sigma: 0.0

success_thresholds: [0.05, 0.10, 0.15]
success_duration: 10
skip_cold_start_steps_use_delay: true
save_per_episode: true

output_root: runs/closed_loop
