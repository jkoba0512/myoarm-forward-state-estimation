# Phase 4: BC policy training config. Reads ScriptedReach demos and
# trains a small MLP (state -> action).

seed: 0

architecture:
  hidden_dims: [256, 256]

train:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 100
  val_fraction: 0.1

output:
  output_root: runs/bc_policies
